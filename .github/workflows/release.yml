name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e .
      - name: Checks
        run: python -m mm678i18n check po encoding
      - name: Build everything
        run: python -m mm678i18n build
        # note: assets/sound and assets/video are not in git, so CI-built
        # archives lack the voice-over content (see docs/dev/release.md)
      - name: Attach release zips to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/out/*.zip
          draft: true
          generate_release_notes: true
