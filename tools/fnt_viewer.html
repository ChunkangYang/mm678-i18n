<title>FNT Browser</title>
<style>
	:root {
		--bg: #16181d; --panel: #1e2128; --edge: #2c3038; --ink: #d8dade;
		--dim: #8b8f98; --accent: #e8a33d; --cellbg: #101216;
	}
	body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; margin: 0; }
	main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
	h1 { font-size: 20px; letter-spacing: .04em; margin: 4px 0 2px; }
	h1 em { color: var(--accent); font-style: normal; }
	.sub { color: var(--dim); font-size: 13px; margin: 0 0 14px; }
	#drop {
		border: 2px dashed var(--edge); border-radius: 10px; padding: 26px;
		text-align: center; color: var(--dim); cursor: pointer; transition: border-color .15s, background .15s;
	}
	#drop.hot { border-color: var(--accent); background: #1d1a12; color: var(--ink); }
	#drop input { display: none; }
	#meta {
		display: none; flex-wrap: wrap; gap: 8px 22px; align-items: baseline;
		background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
		padding: 10px 14px; margin: 14px 0; font-family: ui-monospace, Consolas, monospace; font-size: 13px;
	}
	#meta b { color: var(--accent); font-weight: 600; }
	#meta .k { color: var(--dim); }
	.controls { display: none; gap: 16px; align-items: center; margin: 0 0 12px; font-size: 13px; color: var(--dim); }
	.controls select, .controls input[type=range] { accent-color: var(--accent); background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 5px; padding: 2px 6px; }
	#grid { display: none; grid-template-columns: repeat(16, 1fr); gap: 4px; }
	.cell {
		background: var(--cellbg); border: 1px solid var(--edge); border-radius: 5px;
		padding: 3px 2px 2px; text-align: center; cursor: pointer; min-width: 0;
	}
	.cell:hover { border-color: var(--accent); }
	.cell.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
	.cell.empty { opacity: .3; }
	.cell canvas { image-rendering: pixelated; display: block; margin: 0 auto; background:
		repeating-conic-gradient(#1a1d23 0 25%, #14161b 0 50%) 0 0 / 8px 8px; }
	.cell .cc { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--dim); margin-top: 2px; }
	.cell .ch { font-size: 12px; color: var(--ink); }
	.cell .wd { font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: #5f6470; }
	#detail {
		display: none; position: sticky; bottom: 0; background: var(--panel);
		border: 1px solid var(--edge); border-radius: 10px 10px 0 0; margin-top: 16px;
		padding: 12px 16px; gap: 20px; align-items: flex-start;
	}
	#detail canvas { image-rendering: pixelated; background:
		repeating-conic-gradient(#1a1d23 0 25%, #14161b 0 50%) 0 0 / 12px 12px;
		border: 1px solid var(--edge); border-radius: 4px; }
	#dmeta { font-family: ui-monospace, Consolas, monospace; font-size: 13px; line-height: 1.9; }
	#dmeta .k { color: var(--dim); display: inline-block; min-width: 110px; }
	.legend { margin-top: 8px; font-size: 12px; color: var(--dim); }
	.swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin: 0 3px 0 10px; border: 1px solid var(--edge); }
</style>
<main>
	<h1><em>FNT</em> Browser</h1>
	<p class="sub">Might&nbsp;&amp;&nbsp;Magic 6/7/8 引擎字体检视器 — 拖入 .fnt 文件即可(自动识别标准布局与 calig 型旧布局,数据不离开本机)</p>
	<div id="drop">把 .fnt 拖到这里,或点击选择文件<input type="file" accept=".fnt,.FNT"></div>
	<div id="meta"></div>
	<div class="controls" id="ctl">
		<label>字节→字符 <select id="enc">
			<option value="windows-1252">cp1252 西欧</option>
			<option value="windows-1250">cp1250 中欧</option>
			<option value="windows-1251">cp1251 西里尔</option>
		</select></label>
		<label>缩放 <input id="zoom" type="range" min="1" max="4" value="2"></label>
		<span class="legend">
			<label>本体(255) <input type="color" id="cBody" value="#ffffff"></label>
			<label>阴影(1) <input type="color" id="cShadow" value="#555555"></label>
			<label>灰阶(其他) <input type="color" id="cGray" value="#9a9a9a"></label>
			<span class="swatch"></span>0 透明
		</span>
	</div>
	<div id="grid"></div>
	<div id="detail"><canvas id="dcv"></canvas><div id="dmeta"></div></div>
</main>
<script>
'use strict';
let font = null, selected = -1;

const $ = s => document.querySelector(s);
const drop = $('#drop'), fileInput = $('#drop input');

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => e.target.files[0] && load(e.target.files[0]));
['dragover', 'dragenter'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => e.dataTransfer.files[0] && load(e.dataTransfer.files[0]));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); });

function load(file) {
	file.arrayBuffer().then(buf => {
		const u8 = new Uint8Array(buf);
		font = parseFnt(u8);
		font.name = file.name;
		font.size = u8.length;
		selected = -1;
		render();
	});
}

// glyph: {w, a, c, off} ; pixel(g, x, y) reads from font.data
function parseFnt(u8) {
	const dv = new DataView(u8.buffer);
	const h = u8[5], min = u8[0], max = u8[1];
	// layout A: ABC i32x3 [256] @0x20, offsets i32[256] @0xC20, data @0x1020
	const tryStd = () => {
		if (u8.length < 0x1020 || h < 4 || h > 64) return null;
		const g = [];
		let ok = 0, ink = 0;
		for (let c = 0; c < 256; c++) {
			const a = dv.getInt32(0x20 + 12 * c, true), w = dv.getInt32(0x24 + 12 * c, true),
				sp = dv.getInt32(0x28 + 12 * c, true), off = dv.getInt32(0xC20 + 4 * c, true) + 0x1020;
			const valid = w > 0 && w <= 64 && off >= 0x1020 && off + w * h <= u8.length;
			if (valid) { ok++; for (let i = off; i < off + w * h; i++) if (u8[i]) { ink++; break; } }
			g.push(valid ? { w, a, c: sp, off } : null);
		}
		return (ok > 40 && ink > 20) ? { layout: '标准 (ABC@0x20 + offsets@0xC20 + data@0x1020)', h, min, max, glyphs: g } : null;
	};
	// layout B (calig): offsets i32[max-min+1] @0x19C, data after, w = diff/h
	const tryCalig = () => {
		const count = max - min + 1;
		const base = 0x19C + 4 * count;
		if (h < 4 || h > 64 || count < 2 || base >= u8.length) return null;
		const offs = [];
		for (let i = 0; i < count; i++) offs.push(dv.getInt32(0x19C + 4 * i, true));
		let mono = 0;
		for (let i = 1; i < count; i++) if (offs[i] >= offs[i - 1]) mono++;
		if (mono < count - 8) return null;
		const g = new Array(256).fill(null);
		let ok = 0;
		for (let i = 0; i < count; i++) {
			const nxt = i + 1 < count ? offs[i + 1] : u8.length - base;
			const w = Math.floor((nxt - offs[i]) / h);
			if (w > 0 && w <= 64 && base + offs[i] + w * h <= u8.length) {
				g[min + i] = { w, a: 0, c: 0, off: base + offs[i] };
				ok++;
			}
		}
		return ok > 40 ? { layout: 'calig 型 (offsets@0x19C, 宽=偏移差/字高)', h, min, max, glyphs: g } : null;
	};
	const f = tryStd() || tryCalig() || { layout: '无法识别的布局', h, min, max, glyphs: new Array(256).fill(null) };
	f.data = u8;
	return f;
}

function hexRgb(hex) {
	return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

function pxColor(v) {
	if (v === 0) return null;
	if (v === 255) return $('#cBody').value;
	if (v === 1) return $('#cShadow').value;
	// other values: the picked gray-base color scaled by intensity
	const [r, g, b] = hexRgb($('#cGray').value);
	const f = (90 + Math.min(v, 12) * 12) / 234;
	return `rgb(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)})`;
}

function drawGlyph(cv, g, zoom) {
	const h = font.h;
	cv.width = (g ? g.w : 4) * zoom;
	cv.height = h * zoom;
	if (!g) return false;
	const ctx = cv.getContext('2d');
	let any = false;
	for (let y = 0; y < h; y++)
		for (let x = 0; x < g.w; x++) {
			const v = font.data[g.off + y * g.w + x];
			const col = pxColor(v);
			if (col) { ctx.fillStyle = col; ctx.fillRect(x * zoom, y * zoom, zoom, zoom); any = true; }
		}
	return any;
}

function charLabel(c) {
	try {
		const s = new TextDecoder($('#enc').value).decode(new Uint8Array([c]));
		return (s && s.charCodeAt(0) >= 32) ? s : '·';
	} catch (e) { return '·'; }
}

function render() {
	if (!font) return;
	const inkCount = font.glyphs.filter((g, c) => g && hasInk(c)).length;
	$('#meta').style.display = 'flex';
	$('#meta').innerHTML =
		`<span><b>${font.name}</b> ${font.size} B</span>` +
		`<span><span class="k">布局</span> ${font.layout}</span>` +
		`<span><span class="k">字高</span> <b>${font.h}</b>px</span>` +
		`<span><span class="k">MinChar</span> 0x${font.min.toString(16).toUpperCase()}</span>` +
		`<span><span class="k">MaxChar</span> 0x${font.max.toString(16).toUpperCase()}</span>` +
		`<span><span class="k">有墨字形</span> ${inkCount}/256</span>`;
	$('#ctl').style.display = 'flex';
	const zoom = +$('#zoom').value;
	const grid = $('#grid');
	grid.style.display = 'grid';
	grid.innerHTML = '';
	for (let c = 0; c < 256; c++) {
		const g = font.glyphs[c];
		const cell = document.createElement('div');
		cell.className = 'cell' + (g && hasInk(c) ? '' : ' empty') + (c === selected ? ' sel' : '');
		const cv = document.createElement('canvas');
		drawGlyph(cv, g, zoom);
		cell.appendChild(cv);
		cell.insertAdjacentHTML('beforeend',
			`<div class="cc">${c.toString(16).padStart(2, '0').toUpperCase()} <span class="ch">${escapeHtml(charLabel(c))}</span></div>` +
			`<div class="wd">${g ? 'w' + g.w + (font.layout[0] === '标' ? ' a' + g.a + ' c' + g.c : '') : '—'}</div>`);
		cell.addEventListener('click', () => { selected = c; render(); showDetail(c); });
		grid.appendChild(cell);
	}
	if (selected >= 0) showDetail(selected);
}

function hasInk(c) {
	const g = font.glyphs[c];
	if (!g) return false;
	for (let i = g.off; i < g.off + g.w * font.h; i++) if (font.data[i]) return true;
	return false;
}

function showDetail(c) {
	const g = font.glyphs[c];
	$('#detail').style.display = 'flex';
	const cv = $('#dcv');
	drawGlyph(cv, g, 10);
	const vals = {};
	if (g) for (let i = g.off; i < g.off + g.w * font.h; i++) if (font.data[i]) vals[font.data[i]] = (vals[font.data[i]] || 0) + 1;
	$('#dmeta').innerHTML =
		`<div><span class="k">字符</span> 0x${c.toString(16).toUpperCase()} (${c}) “${escapeHtml(charLabel(c))}”</div>` +
		(g ? `<div><span class="k">宽 × 高</span> ${g.w} × ${font.h}</div>` +
			`<div><span class="k">ABC 间距</span> a=${g.a} w=${g.w} c=${g.c} → 步进 ${g.a + g.w + g.c}</div>` +
			`<div><span class="k">数据偏移</span> 0x${g.off.toString(16).toUpperCase()}</div>` +
			`<div><span class="k">像素值分布</span> ${Object.entries(vals).map(([v, n]) => v + '×' + n).join('  ') || '(空白)'}</div>`
			: '<div>此码位无字形</div>');
}

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

$('#enc').addEventListener('change', render);
$('#zoom').addEventListener('input', render);
['#cBody', '#cShadow', '#cGray'].forEach(s => $(s).addEventListener('input', render));
</script>
</main>
